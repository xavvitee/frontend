<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Бережняк І. Ю. - ІО-43 - ЛР2 - Варіант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Бережняк Ірина Юріївна</h2>
    </header>
    
    <main>
        <section class="task-section">
            <h3>Завдання 1. Таблиця даних</h3>
            <table class="variant-table">
                <tr class="row-1">
                    <td>Бережняк</td>
                    <td>Ірина</td>
                    <td rowspan="2">Юріївна</td>
                    <td>ІО-43</td>
                    <td rowspan="2">ЛР №2</td>
                </tr>
                <tr class="row-2">
                    <td colspan="2">Варіант 4</td>
                    <td>&nbsp;</td>
                </tr>
                <tr class="row-3">
                    <td colspan="2">&nbsp;</td>
                    <td colspan="3">&nbsp;</td>
                </tr>
            </table>
        </section>

        <section class="task-section">
            <h3>Завдання 2. Створення зображень засобами CSS3 (Приціл)</h3>
            <div class="figures-container">
                
                <div class="figure-card">
                    <h4>1. За допомогою position</h4>
                    <div class="canvas">
                        <div class="target-position">
                            <div class="circle-outer"></div>
                            <div class="line-h"></div>
                            <div class="line-v"></div>
                            <div class="circle-inner"></div>
                        </div>
                    </div>
                </div>

                <div class="figure-card">
                    <h4>2. За допомогою transform</h4>
                    <div class="canvas">
                        <div class="target-transform">
                            <div class="circle-outer"></div>
                            <div class="line-h"></div>
                            <div class="line-v"></div>
                            <div class="circle-inner"></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
